name: site-reliability-engineering

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
    paths:
      - "slides-site-reliability-engineering.md"
      - "slides/site-reliability-engineering/*.md"
      - "package.json"
      - ".github/workflows/site-reliability-engineering.yml"
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "lts/*"
      - name: install dependencies
        run: npm install
      - name: slides-build
        run: npm run build:site-reliability-engineering
      - name: slides-ls
        run: ls -l site-reliability-engineering
